name: One-shot provenance refresh
on:
  push:
    paths:
      - '.github/workflows/refresh-provenance.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run provenance:refresh
      - name: Commit refreshed provenance
        run: |
          git config user.name "AureliusWu"
          git config user.email "262956450+AureliusWu@users.noreply.github.com"
          git add docs/provenance.json
          if git diff --cached --quiet; then
            echo "Provenance already current"
          else
            git commit -m "chore: refresh provenance for persistence and timeline"
            git push origin HEAD:main
          fi
