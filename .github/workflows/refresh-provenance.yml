name: One-shot provenance refresh
on:
  push:
    paths:
      - '.github/workflows/refresh-provenance.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh tracked source hashes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const manifestPath = 'docs/provenance.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const tracked = new Map(manifest.files.map(file => [file.target, file]));
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const discovered = [];
          function visit(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['__pycache__', 'bin', 'obj'].includes(entry.name)) continue;
              const name = path.posix.join(dir, entry.name);
              if (entry.isDirectory()) visit(name);
              else if (/\.(ts|mjs|py|ps1|cs|csproj|manifest)$/.test(name) || (name.startsWith('editor/') && /\.(html|css)$/.test(name))) discovered.push(name);
            }
          }
          for (const dir of ['src', 'adapters', 'tools', 'editor', 'hosts/windows']) visit(dir);
          for (const target of discovered.sort()) {
            const hash = sha256(target);
            const existing = tracked.get(target);
            if (existing) existing.targetSha256 = hash;
            else {
              const file = { target, mode: 'new', targetSha256: hash, origins: [] };
              manifest.files.push(file); tracked.set(target, file);
            }
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          git config user.name "AureliusWu"
          git config user.email "262956450+AureliusWu@users.noreply.github.com"
          git add docs/provenance.json
          if git diff --cached --quiet; then
            echo "Provenance already current"
          else
            git commit -m "chore: refresh provenance for spec compliance"
            git push origin HEAD:main
          fi
