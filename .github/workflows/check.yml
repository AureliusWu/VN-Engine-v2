name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python -m adapters.renpy --story examples/renpy/story.json --out examples/renpy/game
      - name: Build self-runtime standalone samples
        run: |
          node tools/package-game.mjs examples/runtime/campus.json build/standalone-campus
          node tools/package-game.mjs examples/runtime/netlove.json build/standalone-chat
          node tools/package-game.mjs examples/runtime/circuit.json build/standalone-investigation
          node tools/package-game.mjs examples/runtime/rain.json build/standalone-script
      - uses: actions/upload-artifact@v4
        with:
          name: vn-engine-standalone-samples
          path: build/standalone-*
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the complete browser and Studio suite, including P0 and P1
        run: npm run test:browser
      - name: Require authored routes and generate source-bound alpha QA reports with decode and standalone checks
        run: node tools/qa-samples.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-qa-reports
          path: build/qa-reports/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-browser-evidence
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-stability-evidence
          path: |
            test-results/r5-*/
            test-results/r4-acceptance-*/R5_ACCEPTANCE_PANEL_REPORT.json
            test-results/r4-acceptance-*/r5-input-read*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r6-stability-evidence
          path: test-results/r6-*/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-release-evidence
          path: test-results/v1-*/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-runtime-evidence
          path: test-results/p0-*/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-resource-dsl-evidence
          path: test-results/p1-*/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-review-evidence
          path: |
            test-results/r4-acceptance-*/studio-ai-*.png
            test-results/r4-acceptance-*/R4_BROWSER_REPORT.json
            test-results/r4-acceptance-*/R4_OFFLINE_STUDIO_REPORT.json
            test-results/creative-*/sdk/project.json
            test-results/creative-*/sdk/assets/
            test-results/creative-*/sdk/preview-desktop/*.png
            test-results/creative-*/sdk/preview-mobile/*.png
            test-results/creative-*/sdk/CREATIVE_REPORT.json
            test-results/creative-*/sdk/ROUTE_REPORT.json
            test-results/creative-*/sdk/MEDIA_REPORT.json
