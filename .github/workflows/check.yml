name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python -m adapters.renpy --story examples/renpy/story.json --out examples/renpy/game
      - name: Build self-runtime standalone samples
        run: |
          node tools/package-game.mjs examples/runtime/campus.json build/standalone-campus
          node tools/package-game.mjs examples/runtime/netlove.json build/standalone-chat
          node tools/package-game.mjs examples/runtime/circuit.json build/standalone-investigation
          node tools/package-game.mjs examples/runtime/rain.json build/standalone-script
      - uses: actions/upload-artifact@v4
        with:
          name: vn-engine-standalone-samples
          path: build/standalone-*
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Run the complete focused Studio suite
        run: npm run test:editor
      - name: Require authored routes and generate source-bound alpha QA reports with decode and standalone checks
        run: node tools/qa-samples.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-qa-reports
          path: build/qa-reports/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-browser-evidence
          path: test-results/
