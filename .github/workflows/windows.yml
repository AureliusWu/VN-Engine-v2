name: Windows native host
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - name: Verify P0 runtime contracts, evidence and Studio on Windows
        run: npm run test:p0
      - name: Verify R3/R4 feedback recovery, AI acceptance and standalone dependency checks on Windows
        run: node --test tests/iteration.test.mjs tests/acceptance.test.mjs tests/qa-report.test.mjs
      - name: Verify P1 DSL, resource budgets and real renderer reuse on Windows
        run: npm run test:p1
      - name: Verify stable decoded audio identities and source-based package modules
        run: node --test tests/audio.test.mjs tests/browser-server.test.mjs tests/compiled-modules.test.mjs tests/package-modules.test.mjs
      - name: Verify R5 authoring, focus and audio regressions on Windows
        run: |
          node --test tests/runtime-media.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/r5-studio-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/r5-runtime-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/r5-feedback-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/acceptance-browser.mjs
      - name: Execute AI CLI flows and machine error checks on Windows
        run: node tools/test-agent-cli.mjs test-results/agent-cli
      - name: Verify R6 drafts, hidden focus, first cues and portable output protection
        run: |
          New-Item -ItemType Directory -Force test-results/r6-package | Out-Null
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/r6-package/package-tests.xml tests/r6-package.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/r6-studio-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/r6-runtime-browser.mjs
      - name: Execute six-discipline creative CLI flow with actual media probes and draft release gate
        run: node tools/creative-example.mjs test-results/creative-cli --cli --no-preview
      - name: Verify v1 author operations, save identity, focus and rendering recovery
        run: |
          New-Item -ItemType Directory -Force test-results/v1-storage | Out-Null
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/v1-storage/storage-tests.xml tests/v1-storage.test.mjs tests/v1-compatibility.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/v1-studio-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/v1-player-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/v1-render-browser.mjs
      - name: Execute R3 two-revision CLI flow with source-bound feedback and new audio bytes
        run: node tools/iteration-example.mjs test-results/iteration-cli --cli --no-preview
      - name: Bundle local editor and independent engine sample
        run: |
          node tools/package-studio.mjs build/windows/site
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/package-game.mjs examples/runtime/campus.json build/windows/demo-game
      - name: Include source-bound creative sample for native WebView2 checks
        shell: pwsh
        run: |
          Copy-Item test-results/creative-cli/game build/windows/site/creative-game -Recurse
          Copy-Item test-results/iteration-cli/latest-game build/windows/site/iteration-game -Recurse
      - name: Publish self-contained Windows host
        run: dotnet publish hosts/windows/VNEngine.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o build/windows/app
      - name: Assemble portable folder
        shell: pwsh
        run: |
          Copy-Item build/windows/site build/windows/app/site -Recurse
          Copy-Item build/windows/demo-game build/windows/app/demo-game -Recurse
          Copy-Item hosts/windows/PORTABLE.md build/windows/app/README.md
          Copy-Item docs build/windows/app/docs -Recurse
          Copy-Item THIRD_PARTY_NOTICES.md build/windows/app/THIRD_PARTY_NOTICES.md
          Copy-Item licenses build/windows/app/licenses -Recurse
          Copy-Item LICENSE build/windows/app/LICENSE.txt
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $Found = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:ProgramFiles/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application") | Where-Object { Test-Path $_ }
          if (-not $Found) {
            $Installer = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $Installer
            $Install = Start-Process $Installer -ArgumentList '/silent','/install' -Wait -PassThru
            if ($Install.ExitCode -notin @(0,3010)) { throw "WebView2 install failed: $($Install.ExitCode)" }
          }
      - name: Native file IO, WebView2 launch and full process restart checks
        shell: pwsh
        run: ./tools/test-windows.ps1 -Executable build/windows/app/VNEngine.exe -Site build/windows/app/site -Game build/windows/app/demo-game
      - name: Archive Windows portable app
        shell: pwsh
        run: |
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path build/windows/app/* -DestinationPath "build/VNEngine-Studio-$Version-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: VNEngine-Studio-win-x64
          path: build/VNEngine-Studio-*-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-evidence
          path: |
            test-results/windows/*.json
            test-results/windows/*.png
            test-results/r6-*/
            test-results/v1-*/
            test-results/p0-*/
            test-results/p1-*/
            test-results/resource-audio/
            test-results/package-modules-browser/
            test-results/agent-cli/
            test-results/creative-cli/CREATIVE_REPORT.json
            test-results/creative-cli/MEDIA_REPORT.json
            test-results/creative-cli/ROUTE_REPORT.json
            test-results/creative-cli/TRANSCRIPT.json
            test-results/creative-cli/game/build-manifest.json
            test-results/windows/io-studio/review.json
            test-results/iteration-cli/ITERATION_REPORT.json
            test-results/iteration-cli/ITERATION_TRANSCRIPT.json
            test-results/iteration-cli/REVISION_MEDIA_REPORT.json
            test-results/iteration-cli/REVISION_SNAPSHOTS.json
            test-results/iteration-cli/IMPACT_ONE.json
            test-results/iteration-cli/IMPACT_TWO.json
            test-results/iteration-cli/ROUTES_ONE.json
            test-results/iteration-cli/ROUTES_FINAL.json
            test-results/iteration-cli/review.json
            test-results/iteration-cli/latest-game/build-manifest.json
